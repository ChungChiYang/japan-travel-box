<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧮 購物速算與比價清單</title>
    <style>
        :root {
            --primary: #e63946;
            --secondary: #457b9d;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Tab 頁籤樣式 */
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #e9ecef;
            color: #495057;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1rem;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .live-calc-preview {
            background: #edf2f4;
            border-left: 4px solid var(--primary);
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .live-calc-preview strong {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.8; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid #ccc; color: #555; }
        .btn-danger { background: #d90429; color: white; }
        .btn-edit { background: #457b9d; color: white; }

        .backup-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            background: #eef2f5;
            padding: 10px;
            border-radius: 8px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px 10px 5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: #457b9d;
            cursor: pointer;
            font-weight: bold;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-card {
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s, background-color 0.3s;
        }

        .item-card.purchased {
            opacity: 0.45;
            background-color: #f1f3f5;
        }
        .item-card.purchased .item-name {
            text-decoration: line-through;
        }

        .item-checkboxes {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-right: 1px solid #eee;
            padding-right: 10px;
        }

        .item-checkboxes label {
            margin: 0;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .item-info { flex: 1; font-size: 0.95rem; }
        .item-info strong { display: block; color: #1d3557; }
        .item-info span { font-size: 0.8rem; color: #777; }
        
        .qty-tag {
            display: inline-block;
            background: #e0e1dd;
            color: #1d3557;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            margin-left: 4px;
        }

        .item-price { text-align: right; }
        .item-price .twd { font-size: 1rem; font-weight: bold; color: #1d3557; }
        .item-price .jpy { font-size: 0.8rem; color: var(--primary); }

        .item-actions {
            display: flex;
            gap: 4px;
            flex: none;
            margin-left: 5px;
        }

        .total-box {
            background: #1d3557;
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
        }
        .total-box h3 { margin: 0 0 5px 0; font-size: 1rem; opacity: 0.9; }
        .total-box .price-large { font-size: 1.8rem; font-weight: bold; color: #4cc9f0; }
        .total-box .qty-summary {
            font-size: 0.95rem;
            color: #f1faee;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.1);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        #import-file { display: none; }

        /* Modal 編輯彈窗樣式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        /* Checklist 專用樣式 */
        .category-card {
            background: white;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #1d3557;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background: #e9ecef;
            border-radius: 10px;
            height: 6px;
            width: 100%;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-bar-fill {
            background: #2a9d8f;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }

        .checklist-item.done span {
            text-decoration: line-through;
            color: #a8a29e;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('calc')">🧮 購物速算</button>
        <button class="tab-btn" onclick="switchTab('checklist')">📋 購物 Checklist</button>
    </div>

    <div class="backup-bar">
        <button class="btn-outline" onclick="exportJSON()">📥 匯出備份 (JSON)</button>
        <button class="btn-outline" onclick="document.getElementById('import-file').click()">📤 匯入備份 (JSON)</button>
        <input type="file" id="import-file" accept=".json" onchange="importJSON(event)">
    </div>

    <div id="tab-calc" class="tab-content active">
        <div class="card">
            <div class="form-group">
                <label for="rate">日圓匯率 (JPY ➡️ TWD)</label>
                <input type="number" id="rate" step="0.0001" value="0.21" oninput="updateRate(); updateLivePreview(); render();">
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="item-category">商品分類</label>
                <select id="item-category">
                    <option value="藥妝">💊 藥妝</option>
                    <option value="家電">🔌 家電</option>
                    <option value="食品零食">🍘 食品 / 零食</option>
                    <option value="服飾鞋包">👟 服飾 / 鞋包</option>
                    <option value="其他" selected>📦 其他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="item-name">商品名稱 / 店名</label>
                <input type="text" id="item-name" placeholder="例：合利他命 270錠 (BicCamera)">
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="item-price">日幣單價</label>
                    <input type="number" id="item-price" placeholder="5000" oninput="updateLivePreview()">
                </div>
                <div class="form-group">
                    <label for="item-qty">數量</label>
                    <input type="number" id="item-qty" value="1" min="1" oninput="updateLivePreview()">
                </div>
                <div class="form-group">
                    <label for="item-discount">折扣 (%)</label>
                    <input type="number" id="item-discount" value="100" placeholder="95" oninput="updateLivePreview()">
                </div>
            </div>

            <div class="form-group">
                <label for="item-tax">適用消費稅率 / 免稅</label>
                <select id="item-tax" onchange="updateLivePreview()">
                    <option value="1.00">免稅 0% (Tax Free / 滿額退稅)</option>
                    <option value="1.10" selected>一般商品 10% (服飾、電器、日用)</option>
                    <option value="1.08">食品/輕稅 8% (超市外帶、零食)</option>
                </select>
            </div>

            <div class="live-calc-preview">
                <span>預覽總日幣: <span id="preview-jpy">¥ 0</span></span>
                <span>約合台幣: <strong id="preview-twd">NT$ 0</strong></span>
            </div>

            <div class="btn-group">
                <button class="btn-primary" onclick="addItem()">➕ 新增品項</button>
            </div>
        </div>

        <div class="list-header">
            <strong style="color: #1d3557;">購物清單</strong>
            <label class="checkbox-label">
                <input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)"> 全選 (計算全趟行程總額)
            </label>
        </div>

        <ul class="item-list" id="item-list"></ul>

        <div class="total-box">
            <h3 id="total-title">預估結帳金額 (已選取品項)</h3>
            <div class="price-large" id="total-twd">約 NT$ 0</div>
            <div id="total-jpy" style="opacity: 0.8; font-size:0.9rem; margin-top:4px;">(總計 ¥ 0)</div>
            <div class="qty-summary" id="total-qty">選取件數：0 件</div>
        </div>
    </div>

    <div id="tab-checklist" class="tab-content">
        <div id="checklist-container"></div>
    </div>
</div>

<div class="modal-overlay" id="edit-modal" onclick="handleModalClick(event)">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#1d3557;">✏️ 編輯商品資料</h3>
        <input type="hidden" id="edit-id">
        
        <div class="form-group">
            <label for="edit-category">商品分類</label>
            <select id="edit-category">
                <option value="藥妝">💊 藥妝</option>
                <option value="家電">🔌 家電</option>
                <option value="食品零食">🍘 食品 / 零食</option>
                <option value="服飾鞋包">👟 服飾 / 鞋包</option>
                <option value="其他">📦 其他</option>
            </select>
        </div>

        <div class="form-group">
            <label for="edit-name">商品名稱 / 店名</label>
            <input type="text" id="edit-name">
        </div>

        <div class="grid-3">
            <div class="form-group">
                <label for="edit-price">日幣單價</label>
                <input type="number" id="edit-price">
            </div>
            <div class="form-group">
                <label for="edit-qty">數量</label>
                <input type="number" id="edit-qty" min="1">
            </div>
            <div class="form-group">
                <label for="edit-discount">折扣 (%)</label>
                <input type="number" id="edit-discount">
            </div>
        </div>

        <div class="form-group">
            <label for="edit-tax">適用消費稅率 / 免稅</label>
            <select id="edit-tax">
                <option value="1.00">免稅 0% (Tax Free / 滿額退稅)</option>
                <option value="1.10">一般商品 10% (服飾、電器、日用)</option>
                <option value="1.08">食品/輕稅 8% (超市外帶、零食)</option>
            </select>
        </div>

        <div class="btn-group" style="margin-top: 15px;">
            <button class="btn-primary" onclick="saveEdit()">💾 儲存修改</button>
            <button class="btn-outline" onclick="closeEditModal()">取消</button>
        </div>
    </div>
</div>

<script>
    let state = {
        rate: 0.21,
        items: []
    };

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'calc') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-calc').classList.add('active');
            render();
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-checklist').classList.add('active');
            renderChecklist();
        }
    }

    function loadData() {
        const saved = localStorage.getItem('shopping_calculator_data');
        if (saved) {
            try {
                state = JSON.parse(saved);
                document.getElementById('rate').value = state.rate || 0.21;
                if (Array.isArray(state.items)) {
                    state.items.forEach(item => {
                        item.category = item.category || '其他';
                        item.qty = item.qty || 1;
                        item.discount = item.discount ?? 100;
                        item.taxRate = item.taxRate || 1.0;
                        item.taxLabel = item.taxLabel || '免稅';
                        item.inCart = item.inCart ?? true;
                        item.purchased = item.purchased ?? false;
                    });
                } else {
                    state.items = [];
                }
            } catch (e) {
                console.error("資料解析失敗", e);
            }
        }
    }

    function saveData() {
        localStorage.setItem('shopping_calculator_data', JSON.stringify(state));
    }

    function updateRate() {
        state.rate = parseFloat(document.getElementById('rate').value) || 0.21;
        saveData();
    }

    function updateLivePreview() {
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        const rawPrice = parseFloat(document.getElementById('item-price').value) || 0;
        const qty = parseInt(document.getElementById('item-qty').value) || 1;
        const discountInput = document.getElementById('item-discount').value;
        const discount = discountInput !== '' ? parseFloat(discountInput) : 100;
        const taxRate = parseFloat(document.getElementById('item-tax').value) || 1.0;

        const discountedUnitPrice = rawPrice * (discount / 100);
        const finalJPY = Math.round(discountedUnitPrice * taxRate * qty);
        const finalTWD = Math.round(finalJPY * rate);

        document.getElementById('preview-jpy').innerText = `¥ ${finalJPY.toLocaleString()}`;
        document.getElementById('preview-twd').innerText = `NT$ ${finalTWD.toLocaleString()}`;
    }

    function addItem() {
        const categorySelect = document.getElementById('item-category');
        const nameInput = document.getElementById('item-name');
        const priceInput = document.getElementById('item-price');
        const qtyInput = document.getElementById('item-qty');
        const discountInput = document.getElementById('item-discount');
        const taxSelect = document.getElementById('item-tax');

        const category = categorySelect.value || '其他';
        const name = nameInput.value.trim() || '未命名商品';
        const rawPrice = parseFloat(priceInput.value);
        const qty = parseInt(qtyInput.value) || 1;
        const discount = discountInput.value !== '' ? parseFloat(discountInput.value) : 100;
        const taxRate = parseFloat(taxSelect.value) || 1.0;

        if (isNaN(rawPrice) || rawPrice <= 0) {
            alert('請輸入有效的日幣單價');
            return;
        }

        let taxLabel = '免稅';
        if (taxRate === 1.10) taxLabel = '10%';
        if (taxRate === 1.08) taxLabel = '8%';

        state.items.push({
            id: Date.now(),
            category: category,
            name: name,
            price: rawPrice,
            qty: qty,
            discount: discount,
            taxRate: taxRate,
            taxLabel: taxLabel,
            inCart: true,
            purchased: false
        });

        saveData();
        render();

        nameInput.value = '';
        priceInput.value = '';
        qtyInput.value = '1';
        discountInput.value = '100';
        updateLivePreview();
        nameInput.focus();
    }

    function toggleStatus(id, key) {
        const item = state.items.find(i => i.id === id);
        if (item) {
            item[key] = !item[key];
            saveData();
            render();
            renderChecklist();
        }
    }

    function toggleSelectAll(checked) {
        state.items.forEach(item => {
            item.inCart = checked;
        });
        saveData();
        render();
    }

    function deleteItem(id) {
        state.items = state.items.filter(item => item.id !== id);
        saveData();
        render();
        renderChecklist();
    }

    function openEditModal(id) {
        const item = state.items.find(i => i.id === id);
        if (!item) return;

        document.getElementById('edit-id').value = item.id;
        document.getElementById('edit-category').value = item.category || '其他';
        document.getElementById('edit-name').value = item.name;
        document.getElementById('edit-price').value = item.price;
        document.getElementById('edit-qty').value = item.qty || 1;
        document.getElementById('edit-discount').value = item.discount ?? 100;
        document.getElementById('edit-tax').value = (item.taxRate || 1.0).toFixed(2);

        document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    function handleModalClick(event) {
        if (event.target.id === 'edit-modal') {
            closeEditModal();
        }
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeEditModal();
        }
    });

    function saveEdit() {
        const id = parseInt(document.getElementById('edit-id').value);
        const item = state.items.find(i => i.id === id);
        if (!item) return;

        const rawPrice = parseFloat(document.getElementById('edit-price').value);
        if (isNaN(rawPrice) || rawPrice <= 0) {
            alert('請輸入有效的日幣單價');
            return;
        }

        const taxRate = parseFloat(document.getElementById('edit-tax').value) || 1.0;
        let taxLabel = '免稅';
        if (taxRate === 1.10) taxLabel = '10%';
        if (taxRate === 1.08) taxLabel = '8%';

        item.category = document.getElementById('edit-category').value || '其他';
        item.name = document.getElementById('edit-name').value.trim() || '未命名商品';
        item.price = rawPrice;
        item.qty = parseInt(document.getElementById('edit-qty').value) || 1;
        
        const discountInput = document.getElementById('edit-discount').value;
        item.discount = discountInput !== '' ? parseFloat(discountInput) : 100;
        
        item.taxRate = taxRate;
        item.taxLabel = taxLabel;

        saveData();
        render();
        renderChecklist();
        closeEditModal();
    }

    function render() {
        const listEl = document.getElementById('item-list');
        listEl.innerHTML = '';

        let totalJPY = 0;
        let totalTWD = 0;
        let totalQty = 0;

        const selectAllCheckbox = document.getElementById('select-all');
        if (state.items.length > 0) {
            selectAllCheckbox.checked = state.items.every(item => item.inCart);
        } else {
            selectAllCheckbox.checked = false;
        }

        state.items.forEach(item => {
            const qty = item.qty || 1;
            const discountedUnitPrice = item.price * (item.discount / 100);
            const itemTotalJPY = Math.round(discountedUnitPrice * (item.taxRate || 1.0) * qty);
            const itemTotalTWD = Math.round(itemTotalJPY * state.rate);
            
            if (item.inCart && !item.purchased) {
                totalJPY += itemTotalJPY;
                totalTWD += itemTotalTWD;
                totalQty += qty;
            }

            const li = document.createElement('li');
            li.className = `item-card ${item.purchased ? 'purchased' : ''}`;
            li.innerHTML = `
                <div class="item-checkboxes">
                    <label>
                        <input type="checkbox" ${item.inCart ? 'checked' : ''} onchange="toggleStatus(${item.id}, 'inCart')"> 試算
                    </label>
                    <label>
                        <input type="checkbox" ${item.purchased ? 'checked' : ''} onchange="toggleStatus(${item.id}, 'purchased')"> 已買
                    </label>
                </div>
                <div class="item-info">
                    <strong class="item-name">[${escapeHtml(item.category || '其他')}] ${escapeHtml(item.name)} <span class="qty-tag">x${qty}</span></strong>
                    <span>單價 ¥${item.price.toLocaleString()} | ${item.discount < 100 ? `${item.discount}折` : '無折扣'} | 稅率: ${item.taxLabel}</span>
                </div>
                <div class="item-price">
                    <div class="twd">約 NT$ ${itemTotalTWD.toLocaleString()}</div>
                    <div class="jpy">¥ ${itemTotalJPY.toLocaleString()}</div>
                </div>
                <div class="item-actions">
                    <button class="btn-edit" style="padding: 6px 8px;" onclick="openEditModal(${item.id})">✏️</button>
                    <button class="btn-danger" style="padding: 6px 8px;" onclick="deleteItem(${item.id})">🗑️</button>
                </div>
            `;
            listEl.appendChild(li);
        });

        const totalTitleEl = document.getElementById('total-title');
        if (selectAllCheckbox.checked && state.items.length > 0) {
            totalTitleEl.innerText = "全趟行程未購買商品總額 (全選試算)";
        } else {
            totalTitleEl.innerText = "預估結帳金額 (已選取試算且未買品項)";
        }

        document.getElementById('total-jpy').innerText = `(總計 ¥ ${totalJPY.toLocaleString()})`;
        document.getElementById('total-twd').innerText = `約 NT$ ${totalTWD.toLocaleString()}`;
        document.getElementById('total-qty').innerText = `選取商品總數量：${totalQty} 件`;
    }

    function renderChecklist() {
        const container = document.getElementById('checklist-container');
        container.innerHTML = '';

        if (state.items.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:30px; color:#888;">尚未新增任何商品，請先在「購物速算」頁籤加入項目。</div>';
            return;
        }

        const categories = {};
        state.items.forEach(item => {
            const cat = item.category || '其他';
            if (!categories[cat]) categories[cat] = [];
            categories[cat].push(item);
        });

        Object.keys(categories).forEach(cat => {
            const items = categories[cat];
            const completedCount = items.filter(i => i.purchased).length;
            const progressPercent = Math.round((completedCount / items.length) * 100);

            const card = document.createElement('div');
            card.className = 'category-card';
            
            let itemsHtml = '';
            items.forEach(item => {
                itemsHtml += `
                    <div class="checklist-item ${item.purchased ? 'done' : ''}">
                        <input type="checkbox" ${item.purchased ? 'checked' : ''} onchange="toggleStatus(${item.id}, 'purchased')">
                        <span style="flex:1;">${escapeHtml(item.name)} <small style="color:#666;">(x${item.qty || 1})</small></span>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="category-header">
                    <span>${escapeHtml(cat)}</span>
                    <span style="font-size:0.85rem; color:#666;">${completedCount} / ${items.length} (${progressPercent}%)</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
                </div>
                <div style="margin-top: 10px;">
                    ${itemsHtml}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }

    function exportJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
        const downloadAnchor = document.createElement('a');
        const today = new Date().toISOString().slice(0, 10);
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `japan_shopping_backup_${today}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const rawData = JSON.parse(e.target.result);
          if (Array.isArray(rawData)) {
            // 驗證並清洗資料，補齊缺少欄位
            items = rawData.map(item => ({
              id: item.id || Date.now() + Math.random(),
              name: item.name || '未命名商品',
              category: item.category || '未分類',
              price: Number(item.price) || 0,
              taxRate: item.taxRate || '10',
              discount: item.discount !== undefined ? Number(item.discount) : 1,
              inCart: Boolean(item.inCart),
              purchased: Boolean(item.purchased),
              note: item.note || ''
            }));
        
            saveData();
            render();
            alert('匯入成功！');
          } else {
            alert('匯入失敗：JSON 格式必須為陣列。');
          }
        } catch (err) {
          alert('匯入失敗：無效的 JSON 檔案格式。');
        } finally {
          event.target.value = ''; // 讀取完成後重置上傳元件
        }
      };
  
      reader.readAsText(file);
    }

    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            loadData();
            render();
            renderChecklist();
        }
    });

    window.addEventListener('focus', function() {
        loadData();
        render();
        renderChecklist();
    });

    // 頁面初始化
    loadData();
    render();
    updateLivePreview();
</script>

</body>
</html>
