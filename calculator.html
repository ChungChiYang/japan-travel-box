<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧮 購物速算與比價清單</title>
    <style>
        :root {
            --primary: #e63946;
            --secondary: #457b9d;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            margin-top: 0;
            color: #1d3557;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .live-calc-preview {
            background: #edf2f4;
            border-left: 4px solid var(--primary);
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .live-calc-preview strong {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.8; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid #ccc; color: #555; }
        .btn-danger { background: #d90429; color: white; }
        .btn-edit { background: #457b9d; color: white; }

        .backup-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            background: #eef2f5;
            padding: 10px;
            border-radius: 8px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px 10px 5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: #457b9d;
            cursor: pointer;
            font-weight: bold;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-card {
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s, background-color 0.3s;
        }

        .item-card.purchased {
            opacity: 0.45;
            background-color: #f1f3f5;
        }
        .item-card.purchased .item-name {
            text-decoration: line-through;
        }

        .item-checkboxes {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-right: 1px solid #eee;
            padding-right: 10px;
        }

        .item-checkboxes label {
            margin: 0;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .item-info { flex: 1; font-size: 0.95rem; }
        .item-info strong { display: block; color: #1d3557; }
        .item-info span { font-size: 0.8rem; color: #777; }
        
        .qty-tag {
            display: inline-block;
            background: #e0e1dd;
            color: #1d3557;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            margin-left: 4px;
        }

        .item-price { text-align: right; }
        .item-price .twd { font-size: 1rem; font-weight: bold; color: #1d3557; }
        .item-price .jpy { font-size: 0.8rem; color: var(--primary); }

        .item-actions {
            display: flex;
            gap: 4px;
            flex: none;
            margin-left: 5px;
        }

        .total-box {
            background: #1d3557;
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
        }
        .total-box h3 { margin: 0 0 5px 0; font-size: 1rem; opacity: 0.9; }
        .total-box .price-large { font-size: 1.8rem; font-weight: bold; color: #4cc9f0; }
        .total-box .qty-summary {
            font-size: 0.95rem;
            color: #f1faee;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.1);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        #import-file { display: none; }

        /* Modal 編輯彈窗樣式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <span>🧮 購物速算與比價</span>
    </h2>

    <!-- 匯入 / 匯出 備份區塊 -->
    <div class="backup-bar">
        <button class="btn-outline" onclick="exportJSON()">📥 匯出備份 (JSON)</button>
        <button class="btn-outline" onclick="document.getElementById('import-file').click()">📤 匯入備份 (JSON)</button>
        <input type="file" id="import-file" accept=".json" onchange="importJSON(event)">
    </div>

    <!-- 頂部通用匯率設定 -->
    <div class="card">
        <div class="form-group">
            <label for="rate">日圓匯率 (JPY ➡️ TWD)</label>
            <input type="number" id="rate" step="0.0001" value="0.21" oninput="updateLivePreview(); render();">
        </div>
    </div>

    <!-- 新增品項 -->
    <div class="card">
        <div class="form-group">
            <label for="item-name">商品名稱 / 店名</label>
            <input type="text" id="item-name" placeholder="例：合利他命 270錠 (BicCamera)">
        </div>

        <div class="grid-3">
            <div class="form-group">
                <label for="item-price">日幣單價</label>
                <input type="number" id="item-price" placeholder="5000" oninput="updateLivePreview()">
            </div>
            <div class="form-group">
                <label for="item-qty">數量</label>
                <input type="number" id="item-qty" value="1" min="1" oninput="updateLivePreview()">
            </div>
            <div class="form-group">
                <label for="item-discount">折扣 (%)</label>
                <input type="number" id="item-discount" value="100" placeholder="95" oninput="updateLivePreview()">
            </div>
        </div>

        <div class="form-group">
            <label for="item-tax">適用消費稅率 / 免稅</label>
            <select id="item-tax" onchange="updateLivePreview()">
                <option value="1.00">免稅 0% (Tax Free / 滿額退稅)</option>
                <option value="1.10" selected>一般商品 10% (服飾、電器、日用)</option>
                <option value="1.08">食品/輕稅 8% (超市外帶、零食)</option>
            </select>
        </div>

        <!-- 即時計算預覽卡片 -->
        <div class="live-calc-preview">
            <span>預覽總日幣: <span id="preview-jpy">¥ 0</span></span>
            <span>約合台幣: <strong id="preview-twd">NT$ 0</strong></span>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="addItem()">➕ 新增品項</button>
        </div>
    </div>

    <!-- 清單控制項 -->
    <div class="list-header">
        <strong style="color: #1d3557;">購物清單</strong>
        <label class="checkbox-label">
            <input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)"> 全選 (計算全趟行程總額)
        </label>
    </div>

    <!-- 清單顯示區 -->
    <ul class="item-list" id="item-list"></ul>

    <!-- 總計區 -->
    <div class="total-box">
        <h3 id="total-title">預估結帳金額 (已選取品項)</h3>
        <div class="price-large" id="total-twd">約 NT$ 0</div>
        <div id="total-jpy" style="opacity: 0.8; font-size:0.9rem; margin-top:4px;">(總計 ¥ 0)</div>
        <div class="qty-summary" id="total-qty">選取件數：0 件</div>
    </div>
</div>

<!-- 編輯彈窗 (Modal) -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#1d3557;">✏️ 編輯商品資料</h3>
        <input type="hidden" id="edit-id">
        
        <div class="form-group">
            <label for="edit-name">商品名稱 / 店名</label>
            <input type="text" id="edit-name">
        </div>

        <div class="grid-3">
            <div class="form-group">
                <label for="edit-price">日幣單價</label>
                <input type="number" id="edit-price">
            </div>
            <div class="form-group">
                <label for="edit-qty">數量</label>
                <input type="number" id="edit-qty" min="1">
            </div>
            <div class="form-group">
                <label for="edit-discount">折扣 (%)</label>
                <input type="number" id="edit-discount">
            </div>
        </div>

        <div class="form-group">
            <label for="edit-tax">適用消費稅率 / 免稅</label>
            <select id="edit-tax">
                <option value="1.00">免稅 0% (Tax Free / 滿額退稅)</option>
                <option value="1.10">一般商品 10% (服飾、電器、日用)</option>
                <option value="1.08">食品/輕稅 8% (超市外帶、零食)</option>
            </select>
        </div>

        <div class="btn-group" style="margin-top: 15px;">
            <button class="btn-primary" onclick="saveEdit()">💾 儲存修改</button>
            <button class="btn-outline" onclick="closeEditModal()">取消</button>
        </div>
    </div>
</div>

<script>
    let state = {
        rate: 0.21,
        items: []
    };

    function loadData() {
        const saved = localStorage.getItem('shopping_calculator_data');
        if (saved) {
            try {
                state = JSON.parse(saved);
                document.getElementById('rate').value = state.rate || 0.21;
            } catch (e) {
                console.error("資料解析失敗", e);
            }
        }
    }

    function saveData() {
        state.rate = parseFloat(document.getElementById('rate').value) || 0.21;
        localStorage.setItem('shopping_calculator_data', JSON.stringify(state));
    }

    function updateLivePreview() {
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        const rawPrice = parseFloat(document.getElementById('item-price').value) || 0;
        const qty = parseInt(document.getElementById('item-qty').value) || 1;
        const discount = parseFloat(document.getElementById('item-discount').value) || 100;
        const taxRate = parseFloat(document.getElementById('item-tax').value) || 1.0;

        const discountedUnitPrice = rawPrice * (discount / 100);
        const finalJPY = Math.round(discountedUnitPrice * taxRate * qty);
        const finalTWD = Math.round(finalJPY * rate);

        document.getElementById('preview-jpy').innerText = `¥ ${finalJPY.toLocaleString()}`;
        document.getElementById('preview-twd').innerText = `NT$ ${finalTWD.toLocaleString()}`;
    }

    function addItem() {
        const nameInput = document.getElementById('item-name');
        const priceInput = document.getElementById('item-price');
        const qtyInput = document.getElementById('item-qty');
        const discountInput = document.getElementById('item-discount');
        const taxSelect = document.getElementById('item-tax');

        const name = nameInput.value.trim() || '未命名商品';
        const rawPrice = parseFloat(priceInput.value);
        const qty = parseInt(qtyInput.value) || 1;
        const discount = parseFloat(discountInput.value) || 100;
        const taxRate = parseFloat(taxSelect.value) || 1.0;

        if (isNaN(rawPrice) || rawPrice <= 0) {
            alert('請輸入有效的日幣單價');
            return;
        }

        let taxLabel = '免稅';
        if (taxRate === 1.10) taxLabel = '10%';
        if (taxRate === 1.08) taxLabel = '8%';

        state.items.push({
            id: Date.now(),
            name: name,
            price: rawPrice,
            qty: qty,
            discount: discount,
            taxRate: taxRate,
            taxLabel: taxLabel,
            inCart: true,
            purchased: false
        });

        saveData();
        render();

        nameInput.value = '';
        priceInput.value = '';
        qtyInput.value = '1';
        discountInput.value = '100';
        updateLivePreview();
    }

    function toggleStatus(id, key) {
        const item = state.items.find(i => i.id === id);
        if (item) {
            item[key] = !item[key];
            saveData();
            render();
        }
    }

    function toggleSelectAll(checked) {
        state.items.forEach(item => {
            item.inCart = checked;
        });
        saveData();
        render();
    }

    function deleteItem(id) {
        state.items = state.items.filter(item => item.id !== id);
        saveData();
        render();
    }

    // 開啟編輯彈窗並填入原資料
    function openEditModal(id) {
        const item = state.items.find(i => i.id === id);
        if (!item) return;

        document.getElementById('edit-id').value = item.id;
        document.getElementById('edit-name').value = item.name;
        document.getElementById('edit-price').value = item.price;
        document.getElementById('edit-qty').value = item.qty || 1;
        document.getElementById('edit-discount').value = item.discount || 100;
        document.getElementById('edit-tax').value = (item.taxRate || 1.0).toFixed(2);

        document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    // 儲存修改後的資料
    function saveEdit() {
        const id = parseInt(document.getElementById('edit-id').value);
        const item = state.items.find(i => i.id === id);
        if (!item) return;

        const rawPrice = parseFloat(document.getElementById('edit-price').value);
        if (isNaN(rawPrice) || rawPrice <= 0) {
            alert('請輸入有效的日幣單價');
            return;
        }

        const taxRate = parseFloat(document.getElementById('edit-tax').value) || 1.0;
        let taxLabel = '免稅';
        if (taxRate === 1.10) taxLabel = '10%';
        if (taxRate === 1.08) taxLabel = '8%';

        item.name = document.getElementById('edit-name').value.trim() || '未命名商品';
        item.price = rawPrice;
        item.qty = parseInt(document.getElementById('edit-qty').value) || 1;
        item.discount = parseFloat(document.getElementById('edit-discount').value) || 100;
        item.taxRate = taxRate;
        item.taxLabel = taxLabel;

        saveData();
        render();
        closeEditModal();
    }

    function render() {
        saveData();
        const listEl = document.getElementById('item-list');
        listEl.innerHTML = '';

        let totalJPY = 0;
        let totalTWD = 0;
        let totalQty = 0;

        const selectAllCheckbox = document.getElementById('select-all');
        if (state.items.length > 0) {
            selectAllCheckbox.checked = state.items.every(item => item.inCart);
        } else {
            selectAllCheckbox.checked = false;
        }

        state.items.forEach(item => {
            const qty = item.qty || 1;
            const discountedUnitPrice = item.price * (item.discount / 100);
            const itemTotalJPY = Math.round(discountedUnitPrice * (item.taxRate || 1.0) * qty);
            const itemTotalTWD = Math.round(itemTotalJPY * state.rate);
            
            // 獨立邏輯：已買的項目不加入結算
            if (item.inCart && !item.purchased) {
                totalJPY += itemTotalJPY;
                totalTWD += itemTotalTWD;
                totalQty += qty;
            }

            const li = document.createElement('li');
            li.className = `item-card ${item.purchased ? 'purchased' : ''}`;
            li.innerHTML = `
                <div class="item-checkboxes">
                    <label>
                        <input type="checkbox" ${item.inCart ? 'checked' : ''} onchange="toggleStatus(${item.id}, 'inCart')"> 試算
                    </label>
                    <label>
                        <input type="checkbox" ${item.purchased ? 'checked' : ''} onchange="toggleStatus(${item.id}, 'purchased')"> 已買
                    </label>
                </div>
                <div class="item-info">
                    <strong class="item-name">${escapeHtml(item.name)} <span class="qty-tag">x${qty}</span></strong>
                    <span>單價 ¥${item.price.toLocaleString()} | ${item.discount < 100 ? `${item.discount}折` : '無折扣'} | 稅率: ${item.taxLabel}</span>
                </div>
                <div class="item-price">
                    <div class="twd">約 NT$ ${itemTotalTWD.toLocaleString()}</div>
                    <div class="jpy">¥ ${itemTotalJPY.toLocaleString()}</div>
                </div>
                <div class="item-actions">
                    <button class="btn-edit" style="padding: 6px 8px;" onclick="openEditModal(${item.id})">✏️</button>
                    <button class="btn-danger" style="padding: 6px 8px;" onclick="deleteItem(${item.id})">🗑️</button>
                </div>
            `;
            listEl.appendChild(li);
        });

        const totalTitleEl = document.getElementById('total-title');
        if (selectAllCheckbox.checked && state.items.length > 0) {
            totalTitleEl.innerText = "全趟行程未購買商品總額 (全選試算)";
        } else {
            totalTitleEl.innerText = "預估結帳金額 (已選取試算且未買品項)";
        }

        document.getElementById('total-jpy').innerText = `(總計 ¥ ${totalJPY.toLocaleString()})`;
        document.getElementById('total-twd').innerText = `約 NT$ ${totalTWD.toLocaleString()}`;
        document.getElementById('total-qty').innerText = `選取商品總數量：${totalQty} 件`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }

    function exportJSON() {
        saveData();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
        const downloadAnchor = document.createElement('a');
        const today = new Date().toISOString().slice(0, 10);
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `japan_shopping_backup_${today}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (importedData && typeof importedData === 'object' && Array.isArray(importedData.items)) {
                    state = importedData;
                    saveData();
                    document.getElementById('rate').value = state.rate || 0.21;
                    render();
                    updateLivePreview();
                    alert('匯入成功！清單與設定已更新。');
                } else {
                    alert('匯入失敗：JSON 格式不符。');
                }
            } catch (err) {
                alert('匯入失敗：無法解析此 JSON 檔案。');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    loadData();
    render();
    updateLivePreview();
</script>

</body>
</html>
