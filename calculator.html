<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧮 購物速算與比價清單</title>
    <style>
        :root {
            --primary: #e63946;
            --secondary: #457b9d;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            margin-top: 0;
            color: #1d3557;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* 輸入時的即時台幣預覽卡片 */
        .live-calc-preview {
            background: #edf2f4;
            border-left: 4px solid var(--primary);
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .live-calc-preview strong {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.8; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--secondary); color: white; }
        .btn-outline { background: transparent; border: 1px solid #ccc; color: #555; }
        .btn-danger { background: #d90429; color: white; }

        .backup-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            background: #eef2f5;
            padding: 10px;
            border-radius: 8px;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-card {
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info { font-size: 0.95rem; }
        .item-info strong { display: block; color: #1d3557; }
        .item-info span { font-size: 0.8rem; color: #777; }
        .item-price { text-align: right; }
        .item-price .twd { font-size: 1rem; font-weight: bold; color: #1d3557; }
        .item-price .jpy { font-size: 0.8rem; color: var(--primary); }

        .total-box {
            background: #1d3557;
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
        }
        .total-box h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .total-box .price-large { font-size: 1.8rem; font-weight: bold; color: #4cc9f0; }

        #import-file { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <span>🧮 購物速算與比價</span>
    </h2>

    <!-- 匯入 / 匯出 備份區塊 -->
    <div class="backup-bar">
        <button class="btn-outline" onclick="exportJSON()">📥 匯出備份 (JSON)</button>
        <button class="btn-outline" onclick="document.getElementById('import-file').click()">📤 匯入備份 (JSON)</button>
        <input type="file" id="import-file" accept=".json" onchange="importJSON(event)">
    </div>

    <!-- 頂部通用匯率設定 -->
    <div class="card">
        <div class="form-group">
            <label for="rate">日圓匯率 (JPY ➡️ TWD)</label>
            <input type="number" id="rate" step="0.0001" value="0.21" oninput="updateLivePreview(); render();">
        </div>
    </div>

    <!-- 新增品項 (每個品項獨立設定稅率) -->
    <div class="card">
        <div class="form-group">
            <label for="item-name">商品名稱 / 店名</label>
            <input type="text" id="item-name" placeholder="例：合利他命 270錠 (BicCamera)">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="item-price">日幣原價 (JPY)</label>
                <input type="number" id="item-price" placeholder="5000" oninput="updateLivePreview()">
            </div>
            <div class="form-group">
                <label for="item-discount">折扣 (折數 / %)</label>
                <input type="number" id="item-discount" value="100" placeholder="95 代表 95 折" oninput="updateLivePreview()">
            </div>
        </div>

        <!-- 稅率選單移至單品項輸入區 -->
        <div class="form-group">
            <label for="item-tax">適用消費稅率 / 免稅</label>
            <select id="item-tax" onchange="updateLivePreview()">
                <option value="1.00">免稅 0% (Tax Free / 滿額退稅)</option>
                <option value="1.10" selected>一般商品 10% (服飾、電器、日用)</option>
                <option value="1.08">食品/輕稅 8% (超市外帶、零食)</option>
            </select>
        </div>

        <!-- 輸入期間即時計算預覽 (跳台幣價) -->
        <div class="live-calc-preview">
            <span>折後含稅日幣: <span id="preview-jpy">¥ 0</span></span>
            <span>約合台幣: <strong id="preview-twd">NT$ 0</strong></span>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="addItem()">➕ 新增品項</button>
        </div>
    </div>

    <!-- 清單顯示區 -->
    <ul class="item-list" id="item-list"></ul>

    <!-- 總計區 -->
    <div class="total-box">
        <h3>預估結帳總額</h3>
        <div class="price-large" id="total-twd">約 NT$ 0</div>
        <div id="total-jpy" style="opacity: 0.8; font-size:0.9rem; margin-top:4px;">(總計 ¥ 0)</div>
    </div>
</div>

<script>
    let state = {
        rate: 0.21,
        items: []
    };

    // 讀取 LocalStorage
    function loadData() {
        const saved = localStorage.getItem('shopping_calculator_data');
        if (saved) {
            try {
                state = JSON.parse(saved);
                document.getElementById('rate').value = state.rate || 0.21;
            } catch (e) {
                console.error("資料解析失敗", e);
            }
        }
    }

    // 儲存至 LocalStorage
    function saveData() {
        state.rate = parseFloat(document.getElementById('rate').value) || 0.21;
        localStorage.setItem('shopping_calculator_data', JSON.stringify(state));
    }

    // 🎯 輸入期間即時計算預覽 (跳台幣金額)
    function updateLivePreview() {
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        const rawPrice = parseFloat(document.getElementById('item-price').value) || 0;
        const discount = parseFloat(document.getElementById('item-discount').value) || 100;
        const taxRate = parseFloat(document.getElementById('item-tax').value) || 1.0;

        const discountedPrice = rawPrice * (discount / 100);
        const finalJPY = Math.round(discountedPrice * taxRate);
        const finalTWD = Math.round(finalJPY * rate);

        document.getElementById('preview-jpy').innerText = `¥ ${finalJPY.toLocaleString()}`;
        document.getElementById('preview-twd').innerText = `NT$ ${finalTWD.toLocaleString()}`;
    }

    // 🎯 新增品項：將「當下選取的稅率與計算結果」鎖定存入物件
    function addItem() {
        const nameInput = document.getElementById('item-name');
        const priceInput = document.getElementById('item-price');
        const discountInput = document.getElementById('item-discount');
        const taxSelect = document.getElementById('item-tax');

        const name = nameInput.value.trim() || '未命名商品';
        const rawPrice = parseFloat(priceInput.value);
        const discount = parseFloat(discountInput.value) || 100;
        const taxRate = parseFloat(taxSelect.value) || 1.0;

        if (isNaN(rawPrice) || rawPrice <= 0) {
            alert('請輸入有效的日幣金額');
            return;
        }

        // 稅率名稱標記
        let taxLabel = '免稅';
        if (taxRate === 1.10) taxLabel = '10%';
        if (taxRate === 1.08) taxLabel = '8%';

        state.items.push({
            id: Date.now(),
            name: name,
            price: rawPrice,
            discount: discount,
            taxRate: taxRate,   // 獨立鎖定品項稅率
            taxLabel: taxLabel
        });

        saveData();
        render();

        nameInput.value = '';
        priceInput.value = '';
        discountInput.value = '100';
        updateLivePreview();
    }

    // 刪除品項
    function deleteItem(id) {
        state.items = state.items.filter(item => item.id !== id);
        saveData();
        render();
    }

    // 渲染列表
    function render() {
        saveData();
        const listEl = document.getElementById('item-list');
        listEl.innerHTML = '';

        let totalJPY = 0;
        let totalTWD = 0;

        state.items.forEach(item => {
            const discountedPrice = item.price * (item.discount / 100);
            const finalJPY = Math.round(discountedPrice * (item.taxRate || 1.0));
            const finalTWD = Math.round(finalJPY * state.rate);
            
            totalJPY += finalJPY;
            totalTWD += finalTWD;

            const li = document.createElement('li');
            li.className = 'item-card';
            li.innerHTML = `
                <div class="item-info">
                    <strong>${escapeHtml(item.name)}</strong>
                    <span>原價 ¥${item.price.toLocaleString()} | ${item.discount < 100 ? `${item.discount}折` : '無折扣'} | 稅率: ${item.taxLabel}</span>
                </div>
                <div class="item-price">
                    <div class="twd">約 NT$ ${finalTWD.toLocaleString()}</div>
                    <div class="jpy">¥ ${finalJPY.toLocaleString()}</div>
                </div>
                <button class="btn-danger" style="flex:none; padding: 6px 10px; margin-left:10px;" onclick="deleteItem(${item.id})">🗑️</button>
            `;
            listEl.appendChild(li);
        });

        document.getElementById('total-jpy').innerText = `(總計 ¥ ${totalJPY.toLocaleString()})`;
        document.getElementById('total-twd').innerText = `約 NT$ ${totalTWD.toLocaleString()}`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }

    // 📥 匯出 JSON (檔名帶當天日期)
    function exportJSON() {
        saveData();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
        const downloadAnchor = document.createElement('a');
        const today = new Date().toISOString().slice(0, 10);
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `japan_shopping_backup_${today}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // 📤 匯入 JSON
    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (importedData && typeof importedData === 'object' && Array.isArray(importedData.items)) {
                    state = importedData;
                    saveData();
                    document.getElementById('rate').value = state.rate || 0.21;
                    render();
                    updateLivePreview();
                    alert('匯入成功！清單與設定已更新。');
                } else {
                    alert('匯入失敗：JSON 格式不符。');
                }
            } catch (err) {
                alert('匯入失敗：無法解析此 JSON 檔案。');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // 初始化
    loadData();
    render();
    updateLivePreview();
</script>

</body>
</html>
