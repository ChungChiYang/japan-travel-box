<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 願望購物清單 Checklist</title>
    <style>
        :root {
            --primary: #2a9d8f;
            --secondary: #e76f51;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #1d3557;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        /* 匯入匯出按鈕區塊 */
        .io-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .btn-io {
            background: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            width: auto;
            font-weight: normal;
        }

        .btn-io:hover {
            background: #dee2e6;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
        }

        button:active { opacity: 0.8; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-send { background: #457b9d; color: white; font-size: 0.8rem; padding: 5px 10px; width: auto; border-radius: 4px; }
        .btn-send.sent { background: #6c757d; opacity: 0.65; cursor: not-allowed; }
        .btn-danger { background: #d90429; color: white; font-size: 0.8rem; padding: 5px 8px; width: auto; border-radius: 4px; }

        .category-card {
            background: white;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #1d3557;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background: #e9ecef;
            border-radius: 10px;
            height: 6px;
            width: 100%;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item.done .item-text {
            text-decoration: line-through;
            color: #a8a29e;
        }

        .item-text {
            flex: 1;
            font-size: 0.95rem;
        }

        .item-text small {
            display: block;
            color: #888;
            font-size: 0.8rem;
        }

        .actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .tag-sent {
            font-size: 0.75rem;
            color: #2a9d8f;
            background: #e8f5e9;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 日本行預買清單 (Checklist)</h2>

    <!-- 匯入 / 匯出 按鈕列 -->
    <div class="io-actions">
        <button class="btn-io" onclick="exportJSON()">📤 匯出 JSON</button>
        <button class="btn-io" onclick="document.getElementById('import-file').click()">📥 匯入 JSON</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importJSON(event)">
    </div>

    <!-- 新增願望卡片 -->
    <div class="card">
        <div class="form-group">
            <label for="wish-cat">主題分類</label>
            <select id="wish-cat">
                <option value="💊 藥妝">💊 藥妝</option>
                <option value="🔌 家電">🔌 家電</option>
                <option value="🍘 食品 / 零食">🍘 食品 / 零食</option>
                <option value="👟 服飾 / 鞋包">👟 服飾 / 鞋包</option>
                <option value="🎁 伴手禮">🎁 伴手禮</option>
                <option value="📦 其他">📦 其他</option>
            </select>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="wish-name">商品名稱</label>
                <input type="text" id="wish-name" placeholder="例：合利他命 EX Plus 270錠">
            </div>
            <div class="form-group">
                <label for="wish-qty">數量</label>
                <input type="number" id="wish-qty" value="1" min="1">
            </div>
        </div>

        <div class="form-group">
            <label for="wish-note">備註 (代購對象 / 目標店面)</label>
            <input type="text" id="wish-note" placeholder="例：幫老爸買、BicCamera 找優惠券">
        </div>

        <button class="btn-primary" onclick="addWishItem()">➕ 加入預買清單</button>
    </div>

    <!-- 清單顯示區 -->
    <div id="checklist-container"></div>
</div>

<script>
    let wishlist = [];

    function loadWishlist() {
        const saved = localStorage.getItem('japan_wishlist_data');
        if (saved) {
            try {
                wishlist = JSON.parse(saved);
            } catch (e) {
                console.error("願望清單解析失敗", e);
            }
        }

        // 檢查計算器中的狀態，若計算器中的項目已被刪除，校正 sentToCalc 狀態
        syncStatusWithCalc();
    }

    function saveWishlist() {
        localStorage.setItem('japan_wishlist_data', JSON.stringify(wishlist));
    }

    // 匯出 JSON 功能
    function exportJSON() {
        if (wishlist.length === 0) {
            alert('目前的預買清單是空的，無法匯出。');
            return;
        }

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(wishlist, null, 2));
        const downloadAnchor = document.createElement('a');
        const today = new Date().toISOString().slice(0, 10);
        
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `japan_wishlist_${today}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // 匯入 JSON 功能
    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (!Array.isArray(importedData)) {
                    alert('匯入失敗：格式不正確，必須是 JSON 陣列資料。');
                    return;
                }

                if (confirm(`確定要匯入 ${importedData.length} 個項目嗎？這將會覆蓋現有的清單。`)) {
                    wishlist = importedData;
                    saveWishlist();
                    render();
                    alert('匯入成功！');
                }
            } catch (err) {
                alert('JSON 解析失敗，請確認檔案格式是否正確。');
                console.error(err);
            }
            // 重置 input 以利重複選擇同名檔案
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    // 校正 sentToCalc 與 purchased 狀態
    function syncStatusWithCalc() {
        const savedCalc = localStorage.getItem('shopping_calculator_data');
        if (!savedCalc) return;

        try {
            const calcState = JSON.parse(savedCalc);
            if (!Array.isArray(calcState.items)) return;

            wishlist.forEach(item => {
                const targetCalcItem = calcState.items.find(i => 
                    i.wishlistId === item.id || i.rawWishName === item.name
                );

                if (targetCalcItem) {
                    item.done = targetCalcItem.purchased; // 自動同步已買狀態
                    item.sentToCalc = true;
                } else {
                    // 若計算器中沒有此 ID/名稱，表示被刪除或未帶入
                    item.sentToCalc = false;
                }
            });
        } catch (e) {
            console.error("同步狀態校正失敗", e);
        }
    }

    function addWishItem() {
        const cat = document.getElementById('wish-cat').value;
        const nameInput = document.getElementById('wish-name');
        const qtyInput = document.getElementById('wish-qty');
        const noteInput = document.getElementById('wish-note');

        const name = nameInput.value.trim();
        const qty = parseInt(qtyInput.value) || 1;
        const note = noteInput.value.trim();

        if (!name) {
            alert('請輸入商品名稱');
            return;
        }

        wishlist.push({
            id: Date.now(),
            category: cat,
            name: name,
            qty: qty,
            note: note,
            done: false,
            sentToCalc: false
        });

        saveWishlist();
        render();

        nameInput.value = '';
        qtyInput.value = '1';
        noteInput.value = '';
        nameInput.focus();
    }

    function toggleDone(id) {
        const item = wishlist.find(i => i.id === id);
        if (item) {
            item.done = !item.done;
            saveWishlist();
            render();

            // 正向同步至購物速算
            const savedCalc = localStorage.getItem('shopping_calculator_data');
            if (savedCalc) {
                try {
                    let calcState = JSON.parse(savedCalc);
                    const targetCalcItem = calcState.items.find(i => 
                        i.wishlistId === item.id || i.rawWishName === item.name
                    );

                    if (targetCalcItem) {
                        targetCalcItem.purchased = item.done; // 自動更新已買狀態
                        localStorage.setItem('shopping_calculator_data', JSON.stringify(calcState));
                    }
                } catch (e) {
                    console.error("同步至速算清單失敗", e);
                }
            }
        }
    }

    function deleteWish(id) {
        const item = wishlist.find(i => i.id === id);
        if (!item) return;

        // 1. 刪除願望清單項目
        wishlist = wishlist.filter(i => i.id !== id);
        saveWishlist();

        // 2. 同步刪除速算清單中的對應項目
        const savedCalc = localStorage.getItem('shopping_calculator_data');
        if (savedCalc) {
            try {
                let calcState = JSON.parse(savedCalc);
                if (Array.isArray(calcState.items)) {
                    calcState.items = calcState.items.filter(i => 
                        i.wishlistId !== id && i.rawWishName !== item.name
                    );
                    localStorage.setItem('shopping_calculator_data', JSON.stringify(calcState));
                }
            } catch (e) {
                console.error("刪除速算對應項目失敗", e);
            }
        }

        render();
    }

    function sendToCalculator(id) {
        const item = wishlist.find(i => i.id === id);
        if (!item || item.sentToCalc) return;

        let calcState = { rate: 0.21, items: [] };
        const savedCalc = localStorage.getItem('shopping_calculator_data');
        if (savedCalc) {
            try { calcState = JSON.parse(savedCalc); } catch(e){}
        }

        // 清理分類字串，去除 Emoji
        let cleanCat = "其他";
        if (item.category.includes("藥妝")) cleanCat = "藥妝";
        else if (item.category.includes("家電")) cleanCat = "家電";
        else if (item.category.includes("食品")) cleanCat = "食品零食";
        else if (item.category.includes("服飾")) cleanCat = "服飾鞋包";

        calcState.items.push({
            id: Date.now(),
            wishlistId: item.id,
            category: cleanCat,
            name: item.name + (item.note ? ` (${item.note})` : ''),
            rawWishName: item.name,
            price: 0,
            qty: item.qty,
            discount: 100,
            taxRate: 1.0,
            taxLabel: '免稅',
            inCart: true,
            purchased: item.done
        });

        localStorage.setItem('shopping_calculator_data', JSON.stringify(calcState));

        item.sentToCalc = true;
        saveWishlist();
        render();
    }

    function render() {
        loadWishlist(); // 每次渲染前自動整合最新狀態
        const container = document.getElementById('checklist-container');
        container.innerHTML = '';

        if (wishlist.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:30px; color:#888;">目前沒有預買品項，快在上方新增吧！</div>';
            return;
        }

        const categories = {};
        wishlist.forEach(item => {
            if (!categories[item.category]) categories[item.category] = [];
            categories[item.category].push(item);
        });

        Object.keys(categories).forEach(cat => {
            const items = categories[cat];
            const completedCount = items.filter(i => i.done).length;
            const progressPercent = Math.round((completedCount / items.length) * 100);

            const card = document.createElement('div');
            card.className = 'category-card';

            let itemsHtml = '';
            items.forEach(item => {
                let actionBtnHtml = '';
                if (item.sentToCalc) {
                    actionBtnHtml = `<button class="btn-send sent" disabled title="已帶入購物速算試算">已帶入 ✓</button>`;
                } else if (item.done) {
                    actionBtnHtml = `<button class="btn-send sent" disabled title="已購買項目無需帶入">已買 ✓</button>`;
                } else {
                    actionBtnHtml = `<button class="btn-send" onclick="sendToCalculator(${item.id})">帶入 🧮</button>`;
                }

                itemsHtml += `
                    <div class="checklist-item ${item.done ? 'done' : ''}">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleDone(${item.id})">
                        <div class="item-text">
                            <strong>${escapeHtml(item.name)} ${item.sentToCalc ? '<span class="tag-sent">試算中</span>' : ''}</strong>
                            <small>數量: ${item.qty} ${item.note ? ' | ' + escapeHtml(item.note) : ''}</small>
                        </div>
                        <div class="actions">
                            ${actionBtnHtml}
                            <button class="btn-danger" onclick="deleteWish(${item.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="category-header">
                    <span>${escapeHtml(cat)}</span>
                    <span style="font-size:0.85rem; color:#666;">${completedCount} / ${items.length} (${progressPercent}%)</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
                </div>
                <div style="margin-top: 8px;">
                    ${itemsHtml}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }

    // 視窗焦點與切換事件監聽
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            render();
        }
    });

    window.addEventListener('focus', function() {
        render();
    });

    // 頁面初始化
    render();
</script>

</body>
</html>
