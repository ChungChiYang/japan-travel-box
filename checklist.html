<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 願望購物清單 Checklist</title>
    <style>
        :root {
            --primary: #2a9d8f;
            --secondary: #e76f51;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #1d3557;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
        }

        button:active { opacity: 0.8; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-send { background: #457b9d; color: white; font-size: 0.8rem; padding: 5px 10px; width: auto; border-radius: 4px; }
        .btn-send.sent { background: #6c757d; opacity: 0.65; cursor: not-allowed; }
        .btn-danger { background: #d90429; color: white; font-size: 0.8rem; padding: 5px 8px; width: auto; border-radius: 4px; }

        .category-card {
            background: white;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #1d3557;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background: #e9ecef;
            border-radius: 10px;
            height: 6px;
            width: 100%;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item.done .item-text {
            text-decoration: line-through;
            color: #a8a29e;
        }

        .item-text {
            flex: 1;
            font-size: 0.95rem;
        }

        .item-text small {
            display: block;
            color: #888;
            font-size: 0.8rem;
        }

        .actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .nav-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #457b9d;
            text-decoration: none;
            font-weight: bold;
        }

        .tag-sent {
            font-size: 0.75rem;
            color: #2a9d8f;
            background: #e8f5e9;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 日本行預買清單 (Checklist)</h2>

    <!-- 新增願望卡片 -->
    <div class="card">
        <div class="form-group">
            <label for="wish-cat">主題分類</label>
            <select id="wish-cat">
                <option value="💊 藥妝">💊 藥妝</option>
                <option value="🔌 家電">🔌 家電</option>
                <option value="🍘 食品 / 零食">🍘 食品 / 零食</option>
                <option value="👟 服飾 / 鞋包">👟 服飾 / 鞋包</option>
                <option value="🎁 伴手禮">🎁 伴手禮</option>
                <option value="📦 其他">📦 其他</option>
            </select>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="wish-name">商品名稱</label>
                <input type="text" id="wish-name" placeholder="例：合利他命 EX Plus 270錠">
            </div>
            <div class="form-group">
                <label for="wish-qty">數量</label>
                <input type="number" id="wish-qty" value="1" min="1">
            </div>
        </div>

        <div class="form-group">
            <label for="wish-note">備註 (代購對象 / 目標店面)</label>
            <input type="text" id="wish-note" placeholder="例：幫老爸買、BicCamera 找優惠券">
        </div>

        <button class="btn-primary" onclick="addWishItem()">➕ 加入預買清單</button>
    </div>

    <!-- 清單顯示區 -->
    <div id="checklist-container"></div>

    
</div>

<script>
    let wishlist = [];

    function loadWishlist() {
        const saved = localStorage.getItem('japan_wishlist_data');
        if (saved) {
            try {
                wishlist = JSON.parse(saved);
            } catch (e) {
                console.error("願望清單解析失敗", e);
            }
        }
    }

    function saveWishlist() {
        localStorage.setItem('japan_wishlist_data', JSON.stringify(wishlist));
    }

    function addWishItem() {
        const cat = document.getElementById('wish-cat').value;
        const name = document.getElementById('wish-name').value.trim();
        const qty = parseInt(document.getElementById('wish-qty').value) || 1;
        const note = document.getElementById('wish-note').value.trim();

        if (!name) {
            alert('請輸入商品名稱');
            return;
        }

        wishlist.push({
            id: Date.now(),
            category: cat,
            name: name,
            qty: qty,
            note: note,
            done: false,
            sentToCalc: false
        });

        saveWishlist();
        render();

        document.getElementById('wish-name').value = '';
        document.getElementById('wish-qty').value = '1';
        document.getElementById('wish-note').value = '';
    }

    function toggleDone(id) {
        const item = wishlist.find(i => i.id === id);
        if (item) {
            item.done = !item.done;
            saveWishlist();
            render();
        }
    }

    function deleteWish(id) {
        wishlist = wishlist.filter(i => i.id !== id);
        saveWishlist();
        render();
    }

    function sendToCalculator(id) {
        const item = wishlist.find(i => i.id === id);
        if (!item || item.sentToCalc) return;

        let calcState = { rate: 0.21, items: [] };
        const savedCalc = localStorage.getItem('shopping_calculator_data');
        if (savedCalc) {
            try { calcState = JSON.parse(savedCalc); } catch(e){}
        }

        let cleanCat = "其他";
        if (item.category.includes("藥妝")) cleanCat = "藥妝";
        else if (item.category.includes("家電")) cleanCat = "家電";
        else if (item.category.includes("食品")) cleanCat = "食品零食";
        else if (item.category.includes("服飾")) cleanCat = "服飾鞋包";

        calcState.items.push({
            id: Date.now(),
            wishlistId: item.id, // 綁定原本願望清單的 ID
            category: cleanCat,
            name: item.name + (item.note ? ` (${item.note})` : ''),
            rawWishName: item.name, // 保留純名稱用於比對
            price: 0,
            qty: item.qty,
            discount: 100,
            taxRate: 1.0,
            taxLabel: '免稅',
            inCart: true,
            purchased: false
        });

        localStorage.setItem('shopping_calculator_data', JSON.stringify(calcState));

        item.sentToCalc = true;
        saveWishlist();
        render();
    }

    function render() {
        loadWishlist(); // 每次渲染時重新讀取最新狀態（包含來自計算器的勾選同步）
        const container = document.getElementById('checklist-container');
        container.innerHTML = '';

        if (wishlist.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:30px; color:#888;">目前沒有預買品項，快在上方新增吧！</div>';
            return;
        }

        const categories = {};
        wishlist.forEach(item => {
            if (!categories[item.category]) categories[item.category] = [];
            categories[item.category].push(item);
        });

        Object.keys(categories).forEach(cat => {
            const items = categories[cat];
            const completedCount = items.filter(i => i.done).length;
            const progressPercent = Math.round((completedCount / items.length) * 100);

            const card = document.createElement('div');
            card.className = 'category-card';

            let itemsHtml = '';
            items.forEach(item => {
                let actionBtnHtml = '';
                if (item.sentToCalc) {
                    actionBtnHtml = `<button class="btn-send sent" disabled>已帶入 ✓</button>`;
                } else if (item.done) {
                    actionBtnHtml = `<button class="btn-send sent" disabled title="已購買項目無需帶入">已買 ✓</button>`;
                } else {
                    actionBtnHtml = `<button class="btn-send" onclick="sendToCalculator(${item.id})">帶入 🧮</button>`;
                }

                itemsHtml += `
                    <div class="checklist-item ${item.done ? 'done' : ''}">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleDone(${item.id})">
                        <div class="item-text">
                            <strong>${escapeHtml(item.name)} ${item.sentToCalc ? '<span class="tag-sent">試算中</span>' : ''}</strong>
                            <small>數量: ${item.qty} ${item.note ? ' | ' + escapeHtml(item.note) : ''}</small>
                        </div>
                        <div class="actions">
                            ${actionBtnHtml}
                            <button class="btn-danger" onclick="deleteWish(${item.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="category-header">
                    <span>${escapeHtml(cat)}</span>
                    <span style="font-size:0.85rem; color:#666;">${completedCount} / ${items.length} (${progressPercent}%)</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
                </div>
                <div style="margin-top: 8px;">
                    ${itemsHtml}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }

    loadWishlist();
    render();
</script>

</body>
</html>
